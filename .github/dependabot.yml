version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    ignore:
      # The Expo and React Native family moves together via `expo install`, never one at a time.
      - dependency-name: expo
      - dependency-name: expo-*
      # Versioned with the Expo SDK (57 pairs with 57.x), so a major bump belongs to an SDK upgrade.
      - dependency-name: babel-preset-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: react-test-renderer
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: '@react-native-community/netinfo'
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-native'
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
