name: Release

# The tag IS the release. Pushing an annotated tag vX.Y.Z on main verifies it, waits for the owner
# to approve the publish (the protected npm-publish environment), publishes the four packages to
# npm with provenance through trusted publishing (OIDC, no token anywhere), and then creates the
# GitHub Release whose body is the tag message: the same convention as morse_app.
# The procedure, and the one-off first publish, are in docs/RELEASING.md.
#
# Every action is pinned by commit SHA (the comment names the version). This workflow can mint an
# OIDC token and write releases, so a moved tag on a third-party action must not be able to run
# here. Dependabot keeps the pins current.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  verify:
    name: Verify the tag and the build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only on purpose: this job installs and builds the whole dev toolchain, so it must not be
    # able to mint the OIDC token. `actions: read` lets the first step read the environment.
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      notes: ${{ steps.tag.outputs.message }}
    steps:
      # A job that names an environment which does not exist makes GitHub create it with NO
      # reviewers, so a tag pushed before the owner set the environment up would publish without
      # approval. Fail closed, first, before anything is built. See docs/RELEASING.md, step 0.
      - name: The npm-publish environment must exist and require a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/environments/npm-publish" \
                --jq '[.protection_rules[] | select(.type=="required_reviewers")] | length')"; then
            echo "::error::The npm-publish environment could not be read. Create it with a" \
                 "required reviewer first (docs/OWNER-ACTIONS.md), then push the tag again."
            exit 1
          fi
          if [ "${COUNT}" -lt 1 ]; then
            echo "::error::The npm-publish environment has no required reviewer, so the publish" \
                 "would run without approval. Add one (docs/OWNER-ACTIONS.md), then push the tag again."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the tag message is read with `git tag -l`, and the main check below
          # needs origin/main.
          fetch-depth: 0

      # Without this the tag arrives LIGHTWEIGHT and the guard below rejects a perfectly good
      # release: actions/checkout writes refs/tags/<name> pointing straight at the commit, so the
      # annotation (the release notes) is nowhere on the runner. The same trap cost morse_app a
      # release. `--force` because that lightweight ref is already there.
      - name: Fetch the real tag objects
        run: git fetch --force --tags origin

      - name: Read the tag
        id: tag
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          # A lightweight tag has no message and would publish an empty release body.
          if [ "$(git cat-file -t "${TAG_NAME}")" != "tag" ]; then
            echo "::error::${TAG_NAME} is a lightweight tag. Releases are cut from annotated" \
                 "tags, because the message is the release notes. Use 'git tag -a'."
            exit 1
          fi

          # A random delimiter: the message is free text and must not be able to end its own block.
          DELIMITER="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "message<<${DELIMITER}"
            git tag -l --format='%(contents)' "${TAG_NAME}"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG_NAME}"

      # Git Flow: releases are cut from main, never from a feature branch or develop.
      - name: The tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::The tagged commit is not on main. Merge the release into main first," \
                 "then tag the merge commit."
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm typecheck:tests
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:md
      - run: pnpm test:ci

      # The tag and the package versions are two declarations of the same fact.
      - name: Check the tag matches every package version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: node scripts/check-release-tag.cjs "${TAG}"

      # The tarballs are made here, once, and these exact files are what the publish job uploads
      # to npm: the pack check below reads them, not a second copy built somewhere else.
      - name: Pack the tarballs
        run: pnpm changeset pack --out-dir "${{ runner.temp }}/release-pack"
      - name: Check the tarballs that will be published
        run: node scripts/verify-pack.cjs "${{ runner.temp }}/release-pack"
      - name: Keep the tarballs for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: ${{ runner.temp }}/release-pack
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected environment: the owner is a required reviewer, so nothing is published until
    # they approve this job in the GitHub UI.
    environment: npm-publish
    permissions:
      contents: read
      # Mints the OIDC token that npm trusted publishing exchanges for a short-lived publish
      # credential, and that signs the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # Never cache in a release build: a poisoned cache must not reach a publish.
          package-manager-cache: false

      - name: Require npm 11.5.1 or newer (trusted publishing needs it)
        run: |
          node -e "
            const [major, minor, patch] = require('node:child_process')
              .execSync('npm --version').toString().trim().split('.').map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error('::error::npm ' + [major, minor, patch].join('.') + ' is older than 11.5.1');
              process.exit(1);
            }
          "

      # Only the changeset CLI is needed here, and this job can mint the OIDC token, so nothing is
      # built and no install script runs: the root package only, from the frozen lockfile.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter offline-detector

      - name: Fetch the tarballs verify packed and checked
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: ${{ runner.temp }}/release-pack

      # Versions already on npm were left out of the plan when the tarballs were packed, so a failed
      # run can be re-run. No git tags are created: the repository tag vX.Y.Z is the release.
      - name: Publish
        run: pnpm changeset publish --from-pack-dir "${{ runner.temp }}/release-pack" --no-git-tag

  github-release:
    name: Create the GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          body: ${{ needs.verify.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
