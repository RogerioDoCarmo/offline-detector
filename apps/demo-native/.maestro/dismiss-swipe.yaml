appId: dev.rogeriodocarmo.offlinedetector.demo
name: Swiping the snackbar away dismisses it
---
- launchApp:
    clearState: true
# A cold emulator can be slow to load the bundle and render the first screen; wait for it
# instead of tapping into a screen that is not there yet.
- extendedWaitUntil:
    visible:
      id: 'simulate-offline'
    timeout: 30000
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible:
      id: 'offline-detector-snackbar'
    timeout: 10000
- swipe:
    from:
      id: 'offline-detector-snackbar'
    direction: RIGHT
    duration: 300
- extendedWaitUntil:
    notVisible:
      id: 'offline-detector-snackbar'
    timeout: 5000
# The banner is a separate piece and stays until it is dismissed too.
- assertVisible:
    id: 'offline-detector-banner'
