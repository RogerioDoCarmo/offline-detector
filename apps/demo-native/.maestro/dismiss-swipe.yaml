appId: dev.rogeriodocarmo.offlinedetector.demo
name: Swiping the snackbar away dismisses it
---
# Launch, and launch again if the first screen never appears. On CI the device log showed
# clearState's force-stop killing the freshly started process ("remove task", then "failed to
# attach"), leaving a blank window that no wait can fix. Only the launch and this wait are retried.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: 'simulate-offline'
          timeout: 15000
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible:
      id: 'offline-detector-snackbar'
    timeout: 10000
- swipe:
    from:
      id: 'offline-detector-snackbar'
    direction: RIGHT
    duration: 300
- extendedWaitUntil:
    notVisible:
      id: 'offline-detector-snackbar'
    timeout: 5000
# The banner is a separate piece and stays until it is dismissed too.
- assertVisible:
    id: 'offline-detector-banner'
