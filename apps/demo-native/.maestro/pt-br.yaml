appId: dev.rogeriodocarmo.offlinedetector.demo
name: pt-BR strings
---
- launchApp:
    clearState: true
# A cold emulator can be slow to load the bundle and render the first screen; wait for it
# instead of tapping into a screen that is not there yet.
- extendedWaitUntil:
    visible:
      id: 'simulate-offline'
    timeout: 30000
- tapOn:
    id: 'locale-pt-BR'
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Sem internet'
    timeout: 10000
- assertVisible: 'Tentar novamente'
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Conexão restabelecida'
    timeout: 10000
