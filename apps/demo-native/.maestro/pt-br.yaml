appId: dev.rogeriodocarmo.offlinedetector.demo
name: pt-BR strings
---
# Launch, and launch again if the first screen never appears. On CI the device log showed
# clearState's force-stop killing the freshly started process ("remove task", then "failed to
# attach"), leaving a blank window that no wait can fix. Only the launch and this wait are retried.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: 'simulate-offline'
          timeout: 15000
- tapOn:
    id: 'locale-pt-BR'
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Sem internet'
    timeout: 10000
- assertVisible: 'Tentar novamente'
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Conexão restabelecida'
    timeout: 10000
