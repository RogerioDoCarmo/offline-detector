appId: dev.rogeriodocarmo.offlinedetector.demo
name: Coming back online shows Back online
---
- launchApp:
    clearState: true
# A cold emulator can be slow to load the bundle and render the first screen; wait for it
# instead of tapping into a screen that is not there yet.
- extendedWaitUntil:
    visible:
      id: 'simulate-offline'
    timeout: 30000
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'No internet'
    timeout: 10000
# The same button now reads "Go back online".
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Back online'
    timeout: 10000
