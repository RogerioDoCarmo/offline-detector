appId: dev.rogeriodocarmo.offlinedetector.demo
name: Coming back online shows Back online
---
# Launch, and launch again if the first screen never appears. On CI the device log showed
# clearState's force-stop killing the freshly started process ("remove task", then "failed to
# attach"), leaving a blank window that no wait can fix. Only the launch and this wait are retried.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: 'simulate-offline'
          timeout: 15000
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'No internet'
    timeout: 10000
# The same button now reads "Go back online".
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Back online'
    timeout: 10000
