appId: dev.rogeriodocarmo.offlinedetector.demo
name: Retry checks again and stays offline while the stub is offline
---
# Launch, and launch again if the first screen never appears. On CI the device log showed
# clearState's force-stop killing the freshly started process ("remove task", then "failed to
# attach"), leaving a blank window that no wait can fix. Only the launch and this wait are retried.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: 'simulate-offline'
          timeout: 15000
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Retry'
    timeout: 10000
- tapOn: 'Retry'
# The stub still rejects, so the check ends offline again.
- extendedWaitUntil:
    visible: 'No internet'
    timeout: 10000
- assertVisible:
    id: 'status-text'
