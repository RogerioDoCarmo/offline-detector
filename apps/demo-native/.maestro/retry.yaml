appId: dev.rogeriodocarmo.offlinedetector.demo
name: Retry checks again and stays offline while the stub is offline
---
- launchApp:
    clearState: true
# A cold emulator can be slow to load the bundle and render the first screen; wait for it
# instead of tapping into a screen that is not there yet.
- extendedWaitUntil:
    visible:
      id: 'simulate-offline'
    timeout: 30000
- tapOn:
    id: 'simulate-offline'
- extendedWaitUntil:
    visible: 'Retry'
    timeout: 10000
- tapOn: 'Retry'
# The stub still rejects, so the check ends offline again.
- extendedWaitUntil:
    visible: 'No internet'
    timeout: 10000
- assertVisible:
    id: 'status-text'
