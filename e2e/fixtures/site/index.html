<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connection status fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem 1rem;
        background: #ffffff;
        color: #111111;
      }
      #status {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-weight: 600;
        background: #0b5d1e;
        color: #ffffff;
      }
      #status[data-state='offline'] {
        background: #8a1c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connection status</h1>
      <p>
        A tiny page for proving the E2E offline fixture. It only listens to window events.
      </p>
      <p id="status" role="status" data-state="online">Online</p>
    </main>
    <script>
      const status = document.getElementById('status');
      const show = (state, text) => {
        status.dataset.state = state;
        status.textContent = text;
      };
      window.addEventListener('offline', () => show('offline', 'Offline'));
      window.addEventListener('online', () => show('online', 'Online'));
    </script>
  </body>
</html>
