sonar.projectKey=RogerioDoCarmo_offline-detector
sonar.organization=rogeriodocarmo
sonar.projectName=offline-detector
sonar.sources=.
sonar.tests=.

# Library source and the demo apps. `apps/` does not exist yet; an inclusion that matches nothing
# is harmless, whereas a missing `sonar.sources` folder would fail the scan.
sonar.inclusions=packages/*/src/**,apps/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.stryker-tmp/**,**/reports/**,**/storybook-static/**,**/playwright-report/**,**/.superpowers/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirrors jest.config.js `collectCoverageFrom` negations, so the metric reflects real runtime code.
# Demo apps are outside the coverage threshold by design (spec section 7).
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,**/*.d.ts,apps/**
